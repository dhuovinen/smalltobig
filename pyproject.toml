[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smalltobig"
version = "0.0.0"
description = "From Small to Big: turn conversation advice into sourced, practisable rules — locally"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "From Small to Big Contributors" },
]
keywords = ["conversation", "small-talk", "mlx", "local-llm", "spaced-repetition"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# Apple Silicon only. Kept optional so the package installs and tests run on
# Linux CI, where MLX cannot be built at all.
mlx = [
    "mlx-lm>=0.20",
    "mlx-embeddings>=0.0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
stb = "smalltobig.cli:main"

[project.urls]
Repository = "https://github.com/dhuovinen/smalltobig"
Documentation = "https://github.com/dhuovinen/smalltobig/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/smalltobig"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TC"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mlx: requires a running mlx_lm.server and Apple Silicon (deselect with '-m \"not mlx\"')",
]
